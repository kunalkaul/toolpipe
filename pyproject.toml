[project]
name = "toolpipe"
version = "0.1.0"
description = "Pass MCP results by reference, not through the LLM."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Kunal Kaul", email = "kkdevcode@gmail.com" }]
keywords = ["mcp", "llm", "proxy", "tools"]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4,<5",
    "jmespath>=1.1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/kunalkaul/toolpipe"
Repository = "https://github.com/kunalkaul/toolpipe"
Changelog = "https://github.com/kunalkaul/toolpipe/blob/main/CHANGELOG.md"

[project.scripts]
toolpipe = "toolpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolpipe"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
# Discovery parsers uniformly raise ValueError for all malformed inputs.
"src/toolpipe/discovery.py" = ["TRY004"]

[tool.ruff.format]
exclude = ["README.md", "misc/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/toolpipe"]

[tool.pyright]
pythonVersion = "3.11"
executionEnvironments = [{ root = "src" }]
